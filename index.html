<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Gestión de Información</title>
    <style>
        /* Estilos modernos y limpios */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px 40px;
            transition: all 0.3s ease;
        }
        h1 {
            text-align: center;
            color: #1a2b4c;
            font-weight: 600;
            border-bottom: 3px solid #4a90e2;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .checklist li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f9fafc;
            border-radius: 12px;
            border-left: 5px solid #4a90e2;
            transition: background 0.2s, transform 0.1s;
            font-size: 1.05rem;
            color: #1e2a3a;
            font-weight: 500;
            gap: 15px;
        }
        .checklist li:hover {
            background: #f0f4fe;
            transform: translateX(4px);
        }
        /* Ocultamos el checkbox por defecto y creamos uno personalizado */
        .checklist li input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #b0c4de;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: 0.15s;
            background: white;
            flex-shrink: 0;
            position: relative;
        }
        /* Estilo cuando está marcado */
        .checklist li input[type="checkbox"]:checked {
            background: #4a90e2;
            border-color: #4a90e2;
            box-shadow: 0 2px 6px rgba(74, 144, 226, 0.3);
        }
        /* Dibujamos el check (✓) con un pseudo-elemento */
        .checklist li input[type="checkbox"]:checked::after {
            content: "✓";
            font-size: 18px;
            font-weight: bold;
            color: white;
            position: absolute;
            left: 3px;
            top: -1px;
        }
        .checklist li .text {
            flex: 1;
        }
        /* Contador de progreso */
        .progress-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #dce4ec;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .progress-text {
            font-size: 1rem;
            color: #2c3e50;
            font-weight: 500;
        }
        .progress-text span {
            font-weight: 700;
            color: #1a2b4c;
        }
        .btn-reset {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.2);
        }
        .btn-reset:hover {
            background: #c0392b;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        .btn-reset:active {
            transform: scale(0.96);
        }
        /* Pequeño para móviles */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .checklist li {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
        }
        /* Resaltar si está completado */
        .completed-message {
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #27ae60;
            display: none;
        }
        .completed-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Checklist de Gestión</h1>

        <!-- Lista de ítems con los títulos proporcionados -->
        <ul class="checklist" id="checklist">
            <li>
                <input type="checkbox" id="item1">
                <label for="item1" class="text">2.2.1. Gestión de la Información en Instituciones Educativas</label>
            </li>
            <li>
                <input type="checkbox" id="item2">
                <label for="item2" class="text">2.2.2. Transformación Digital en la Educación Superior</label>
            </li>
            <li>
                <input type="checkbox" id="item3">
                <label for="item3" class="text">2.2.3. Sistemas de Información</label>
            </li>
            <li>
                <input type="checkbox" id="item4">
                <label for="item4" class="text">2.2.4. Ingeniería de Software y Aplicaciones Web</label>
            </li>
            <li>
                <input type="checkbox" id="item5">
                <label for="item5" class="text">2.2.5. Intranets Institucionales</label>
            </li>
            <li>
                <input type="checkbox" id="item6">
                <label for="item6" class="text">2.2.6. Gestión de Correos Institucionales</label>
            </li>
            <li>
                <input type="checkbox" id="item7">
                <label for="item7" class="text">2.2.7. Gestión de Prácticas Preprofesionales</label>
            </li>
            <li>
                <input type="checkbox" id="item8">
                <label for="item8" class="text">2.2.8. Gestión Documental</label>
            </li>
            <li>
                <input type="checkbox" id="item9">
                <label for="item9" class="text">2.2.9. Metodologías de Desarrollo de Software</label>
            </li>
            <li>
                <input type="checkbox" id="item10">
                <label for="item10" class="text">2.2.10. Base de Datos y Modelado de Datos</label>
            </li>
            <li>
                <input type="checkbox" id="item11">
                <label for="item11" class="text">2.2.11. Calidad de Software y Usabilidad</label>
            </li>
        </ul>

        <!-- Área de progreso y acciones -->
        <div class="progress-area">
            <div class="progress-text">
                ✅ Completados: <span id="countDisplay">0</span> / <span id="totalDisplay">11</span>
            </div>
            <button class="btn-reset" id="resetBtn">🔄 Desmarcar todo</button>
        </div>
        <div id="completedMessage" class="completed-message">🎉 ¡Todos los ítems completados! Excelente trabajo.</div>
    </div>

    <script>
        (function() {
            const checklist = document.getElementById('checklist');
            const checkboxes = checklist.querySelectorAll('input[type="checkbox"]');
            const countDisplay = document.getElementById('countDisplay');
            const totalDisplay = document.getElementById('totalDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const completedMessage = document.getElementById('completedMessage');

            // Actualizar contador y mensaje de finalización
            function updateProgress() {
                let checked = 0;
                checkboxes.forEach(cb => {
                    if (cb.checked) checked++;
                });
                countDisplay.textContent = checked;
                const total = checkboxes.length;
                totalDisplay.textContent = total;

                // Mostrar mensaje si todos están marcados
                if (checked === total && total > 0) {
                    completedMessage.classList.add('show');
                } else {
                    completedMessage.classList.remove('show');
                }
            }

            // Asignar evento a cada checkbox
            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateProgress);
            });

            // Botón reset: desmarcar todos
            resetBtn.addEventListener('click', function() {
                checkboxes.forEach(cb => {
                    cb.checked = false;
                });
                updateProgress(); // actualizar contador y mensaje
            });

            // Inicializar contador y total
            totalDisplay.textContent = checkboxes.length;
            updateProgress(); // para que el contador muestre 0 al inicio y oculte mensaje

            // (Opcional) Si quieres que al hacer clic en el label también funcione, 
            // ya que los labels están asociados con el atributo "for" y el id del input.
        })();
    </script>

</body>
</html>
